name: local_mock_desktop
description: Desktop controller for local_mock Dart VM Service extensions.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  local_mock_core:
    path: ../local_mock_package/local_mock_core
  vm_service: ^15.0.2
  path_provider: ^2.1.5
