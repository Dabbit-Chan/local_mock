name: local_mock_client
description: local_mock web console — inspect app requests and push mock rules.
publish_to: none
version: 2.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  local_mock_core: 2.0.0
  local_mock_transport: 2.0.0
  mime: ^2.0.0
  web: ^1.1.1
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  go_router: ^18.1.2

dev_dependencies:
  local_mock_http: 2.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
