name: local_mock_client
description: Web controller for app-initiated local_mock sessions.
publish_to: none
version: 0.3.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  local_mock_core:
    path: ../local_mock_package/local_mock_core
  local_mock_transport:
    path: ../local_mock_package/local_mock_transport
  flutter_reorderable_grid_view: ^5.7.0
  mime: ^2.0.0

dev_dependencies:
  local_mock_http:
    path: ../local_mock_package/local_mock_http
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
