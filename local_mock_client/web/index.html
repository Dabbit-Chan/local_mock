<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`; must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="local_mock 控制台：查看 Flutter App 的请求，编写并下发 Mock 规则。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Local Mock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Local Mock</title>
  <!-- Paint the page colour before Flutter starts so dark mode does not flash white. -->
  <style>
    html, body { margin: 0; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { html, body { background: #111111; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
