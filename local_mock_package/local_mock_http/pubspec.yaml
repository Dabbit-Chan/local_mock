name: local_mock_http
description: Debug-only dart:io HttpClient mocking for local_mock via HttpOverrides. Works with package:http and other dart:io based clients.
version: 0.1.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  local_mock_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.4.0
